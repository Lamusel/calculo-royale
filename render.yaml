# Blueprint de Render: servidor del juego (Socket.io) en el plan gratis.
# En Render: New + → Blueprint → elegir este repositorio (ver la guía del README).
services:
  - type: web
    name: calculo-royale-server
    runtime: node
    plan: free
    # Solo el servidor y el workspace compartido, sin dependencias de desarrollo
    buildCommand: npm ci --omit=dev --ignore-scripts -w @calculo-royale/server -w @calculo-royale/shared
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # URL del cliente en Vercel (se completa después de crear el proyecto en Vercel)
      - key: CLIENT_ORIGIN
        sync: false
      # Opcional: guardar resultados en Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
